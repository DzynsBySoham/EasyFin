name: Native iOS companion build
on:
  push:
    paths: ['native/**', '.github/workflows/native-ios.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec native/ios/project.yml
      - name: Compile app, widget, control and unit tests (unsigned simulator)
        run: >-
          xcodebuild build-for-testing
          -project native/ios/EasyFinCompanion.xcodeproj
          -scheme EasyFinCompanion
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Run navigation unit tests on an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in devices.items() if "iOS" in runtime for d in items if "iPhone" in d["name"]))')
          xcodebuild test \
            -project native/ios/EasyFinCompanion.xcodeproj \
            -scheme EasyFinCompanion \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
